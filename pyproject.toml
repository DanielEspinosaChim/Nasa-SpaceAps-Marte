[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marsmap"
version = "0.1.0"
description = "Mars Scout — rover simulado que planifica misiones sobre capas de terreno de Marte (NASA Space Apps 2026)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "rasterio>=1.4",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pillow>=10.0",
    "shapely>=2.0",
    "pymoo>=0.6.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5"]
notebook = ["matplotlib>=3.8", "nbformat>=5.9", "nbconvert>=7.0", "ipykernel>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
marsmap = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: tests de rendimiento o calidad que tardan más de unos segundos", "real: usan el DEM real de NASA en data/raw/jezero (se omiten si no está)"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["notebooks"]  # el notebook es material de demostración, no código del paquete

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "E501"]  # E501: el formateador cubre el código; las cadenas en español no se parten

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S311"]
